[package]
name = "blazebee-queue"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true


[package.metadata.release]
tag-name = "v{{version}}"
sign-tag = false
push = false
publish = false

[lib]
name = "blazebee_queue"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
bytes = "1.6"
memmap2 = "0.9"
crc32fast = "1.3"
aes-gcm = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
parking_lot = "0.12"
dashmap = "5.5"
prometheus = { version = "0.13", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
num_cpus = "1.16"

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
proptest = "1.4"
serial_test = "3"

[features]
default = ["encryption"]
encryption = ["aes-gcm", "rand"]
metrics = ["prometheus"]
full = ["encryption", "metrics"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1