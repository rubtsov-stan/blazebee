# BlazeBee configuration.
#
# The file is read from $BLAZEBEE_CONFIG or /etc/blazebee/config.toml.
# Unknown keys are rejected at startup. In string values, ${NAME} is replaced
# with the environment variable NAME; an unset variable is an error. Write
# $${ for a literal ${.

[logger]
# A level (trace, debug, info, warn, error, off) or a tracing directive list
# such as "info,rumqttc=warn". RUST_LOG, when set, takes precedence.
level = "info"
# rfc3339 (default) or unix (seconds since the epoch with microseconds).
timestamp_format = "rfc3339"

[logger.console]
enabled = true
# compact, pretty or json
format = "compact"
show_target = false
show_thread_ids = false
show_spans = false
ansi_colors = true

[logger.journald]
# Log directly to systemd-journald. Leave disabled when stdout already goes
# to the journal, otherwise every line is recorded twice.
enabled = false
identifier = "blazebee"

[transport]
host = "localhost"
port = 1883
# Prefix for all topics. Metrics are published at "<base_topic>/<topic>" and
# the retained connection status at "<base_topic>/status" ("online"/"offline").
base_topic = "blazebee"
# Leave empty to use "blazebee-<hostname>". Keep it stable when
# clean_session = false, otherwise the broker accumulates stale sessions.
client_id = ""
# username = "blazebee"
# password = "${MQTT_PASSWORD}"
keep_alive = 60
clean_session = false
max_inflight = 10
# Largest MQTT packet this client will send, in bytes (64 .. 268435455).
max_packet_size = 1048576
# Bounded queue between the collectors and the network; must be larger than
# the number of enabled collectors.
request_channel_capacity = 64

[transport.tls]
# TLS is used when enabled = true or when ca_cert_path is set. Without a CA
# path the system trust store verifies the broker certificate.
enabled = false
# ca_cert_path = "/etc/ssl/certs/ca-certificates.crt"
# client_cert_path = "/etc/blazebee/client.crt"
# client_key_path = "/etc/blazebee/client.key"

[transport.serialization]
# json, msgpack or cbor
format = "json"
# none, gzip or zstd; applied to payloads of at least compression_threshold
# bytes. Subscribers must know the format and compression in use.
compression = "none"
compression_threshold = 1024

[transport.framing]
# Splits every payload into 21-byte-header frames that fit max_packet_size.
# Only enable this when the consumer reassembles frames.
enabled = false

[metrics]
# Seconds between sampling cycles (at least 1).
collection_interval = 5

# One [[metrics.collectors.enabled]] table per collector. The collectors
# below are available in every build (minimal, standard, large).

[[metrics.collectors.enabled]]
name = "cpu"
[metrics.collectors.enabled.metadata]
topic = "metrics/cpu"
qos = 0
retain = true

[[metrics.collectors.enabled]]
name = "ram"
[metrics.collectors.enabled.metadata]
topic = "metrics/ram"
qos = 0
retain = true

[[metrics.collectors.enabled]]
name = "disk"
[metrics.collectors.enabled.metadata]
topic = "metrics/disk"
qos = 0
retain = true

[[metrics.collectors.enabled]]
name = "processes"
[metrics.collectors.enabled.metadata]
topic = "metrics/processes"
qos = 0
retain = false

[[metrics.collectors.enabled]]
name = "uptime"
[metrics.collectors.enabled.metadata]
topic = "metrics/uptime"
qos = 0
retain = true

[[metrics.collectors.enabled]]
name = "load_average"
[metrics.collectors.enabled.metadata]
topic = "metrics/load_average"
qos = 0
retain = true

