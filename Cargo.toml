[workspace]
members = ["crates/mqtt/v3"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
authors = ["Stanislav Rubtsov <rubtzov.stas@gmail.com>"]
repository = "https://github.com/rubtsov-stan/blazebee"
homepage = "https://rubtsov-stan.github.io/blazebee/"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", default-features = false }
tracing = "0.1"

[package]
name = "blazebee"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lightweight system metrics collector for Linux that publishes to MQTT"
readme = "README.md"
documentation = "https://rubtsov-stan.github.io/blazebee/"
keywords = ["monitoring", "metrics", "mqtt", "system", "linux"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["/target", "/docs", "/.github"]
publish = false

[[bin]]
name = "blazebee"
path = "src/main.rs"

[package.metadata.release]
tag-name = "v{{version}}"
sign-tag = false
push = false
publish = false

[features]
default = ["standard"]

minimal = [
    "collector-cpu",
    "collector-ram",
    "collector-disk",
    "collector-uptime",
    "collector-loadavg",
    "collector-processes",
]

standard = [
    "minimal",
    "collector-network",
    "collector-netstat",
    "collector-sockstat",
    "collector-vmstat",
    "collector-filesystem",
    "collector-systemd",
    "collector-ntp",
]

large = [
    "standard",
    "collector-arp",
    "collector-softnet",
    "collector-conntrack",
    "collector-ipvs",
    "collector-pressure",
    "collector-thermal",
    "collector-hwmon",
    "collector-entropy",
    "collector-filefd",
    "collector-schedstat",
    "collector-stat",
    "collector-power",
    "collector-edac",
    "collector-mdraid",
]

collector-arp = []
collector-conntrack = []
collector-cpu = []
collector-disk = []
collector-edac = []
collector-entropy = []
collector-filefd = []
collector-filesystem = []
collector-hwmon = []
collector-ipvs = []
collector-loadavg = []
collector-mdraid = []
collector-netstat = []
collector-network = []
collector-ntp = []
collector-power = []
collector-pressure = []
collector-processes = []
collector-ram = []
collector-schedstat = []
collector-sockstat = []
collector-softnet = []
collector-stat = []
collector-systemd = []
collector-thermal = []
collector-uptime = []
collector-vmstat = []

[dependencies]
blazebee-mqtt-v3 = { path = "crates/mqtt/v3" }
erased-serde = "0.4"
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "signal", "process"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tracing = { workspace = true }
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "json", "std"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[[bench]]
name = "parsers"
harness = false
required-features = ["large"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
debug = false

[package.metadata.deb]
maintainer = "Stanislav Rubtsov <rubtzov.stas@gmail.com>"
extended-description = """\
BlazeBee samples Linux kernel interfaces (/proc, /sys) at a fixed interval and \
publishes the resulting metrics to an MQTT broker. It runs as a systemd service \
under a dynamic, unprivileged user."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/blazebee", "/usr/bin/blazebee", "755"],
    ["config.example.toml", "/etc/blazebee/config.toml", "644"],
]
conf-files = ["/etc/blazebee/config.toml"]
maintainer-scripts = "packaging/debian"
# cargo-deb installs the unit from `unit-scripts` and generates the
# enable/start snippets into the maintainer scripts.
systemd-units = { enable = true, unit-name = "blazebee", unit-scripts = "contrib/systemd" }

[package.metadata.deb.variants.minimal]
features = ["minimal"]
default-features = false

[package.metadata.deb.variants.standard]
features = ["standard"]
default-features = false

[package.metadata.deb.variants.large]
features = ["large"]
default-features = false
